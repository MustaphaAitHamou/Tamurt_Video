# Intégration continue : qualité, tests unitaires, tests d'intégration sur une
# base Supabase locale éphémère, construction et tests de bout en bout.
# Ce workflow ne déploie RIEN et n'utilise aucun secret de production.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Qualité et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typage
        run: pnpm typecheck
      - name: Format
        run: pnpm format:check
      - name: Traductions
        run: pnpm i18n:check
      - name: Tests unitaires
        run: pnpm test

  integration-e2e:
    name: Intégration, build et E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Outils système (ffmpeg pour les médias de test synthétiques)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Pile Supabase locale (migrations + seed)
        run: pnpm db:start:ci
      - name: Fichier d'environnement local
        run: pnpm env:local
      - name: Tests d'intégration (RLS, droits, lecture, paiements)
        run: pnpm test:integration
      - name: Données de démonstration fictives
        run: pnpm seed:demo
      - name: Médias de test synthétiques
        run: pnpm media:dev
        env:
          DEV_MEDIA_DURATION_SCALE: "0.2"
      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Construction
        run: pnpm build
      - name: Tests de bout en bout
        run: pnpm test:e2e
        env:
          CI: "true"
          # Version de production servie localement avec les médias synthétiques de test :
          # dérogation limitée à cette étape (jamais à définir sur un déploiement réel).
          ALLOW_DEV_STREAMING_IN_PRODUCTION: "true"
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Arrêt de Supabase
        if: always()
        run: pnpm db:stop

# Configuration Supabase locale de Tamurt Vidéo.
# Utilisée par `pnpm db:start` (Supabase CLI + Docker). Les réglages équivalents
# du projet Supabase hébergé se font dans le tableau de bord : voir docs/SERVICES_SETUP.md.
project_id = "tamurt-video"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Serveur SMTP de test (Mailpit) : interface sur http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 60
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 60
token_verifications = 60
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirmez votre adresse email — Tamurt Vidéo"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe — Tamurt Vidéo"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse email — Tamurt Vidéo"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion — Tamurt Vidéo"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# Authentification renforcée (TOTP) : obligatoire pour l'accès au back-office
# lorsque ADMIN_MFA_REQUIRED=true.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Connexion Google facultative : renseigner les identifiants OAuth puis passer
# enabled = true (et NEXT_PUBLIC_AUTH_GOOGLE_ENABLED=true côté application).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
